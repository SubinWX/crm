<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of client, renewal and invoice cards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4a3c"/>
      <stop offset="1" stop-color="#111917"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc3a1"/>
      <stop offset="1" stop-color="#1f8a70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="690" cy="120" r="260" fill="#1f8a70" opacity=".22"/>
  <circle cx="60" cy="930" r="300" fill="#1f8a70" opacity=".14"/>
  <g stroke="#ffffff" stroke-opacity=".05">
    <path d="M0 200H800M0 400H800M0 600H800M0 800H800M200 0V1000M400 0V1000M600 0V1000"/>
  </g>

  <!-- Browser / website card -->
  <g filter="url(#shadow)" transform="translate(110 150) rotate(-4)">
    <rect width="470" height="300" rx="18" fill="#ffffff"/>
    <rect width="470" height="46" rx="18" fill="#eef7f4"/>
    <rect y="28" width="470" height="18" fill="#eef7f4"/>
    <circle cx="26" cy="23" r="6" fill="#f87171"/><circle cx="46" cy="23" r="6" fill="#fbbf24"/><circle cx="66" cy="23" r="6" fill="#34d399"/>
    <rect x="96" y="13" width="250" height="20" rx="10" fill="#d6ece5"/>
    <rect x="28" y="74" width="190" height="18" rx="6" fill="#18231f"/>
    <rect x="28" y="104" width="250" height="10" rx="5" fill="#d6d3d1"/>
    <rect x="28" y="124" width="210" height="10" rx="5" fill="#e7e5e4"/>
    <rect x="28" y="156" width="96" height="30" rx="8" fill="#15735c"/>
    <rect x="310" y="72" width="132" height="120" rx="12" fill="#aed9cc"/>
    <path d="M322 176l34-42 26 28 20-22 28 36z" fill="#1f8a70"/>
    <circle cx="412" cy="100" r="12" fill="#ffffff"/>
    <rect x="28" y="218" width="126" height="56" rx="10" fill="#f5f5f4"/>
    <rect x="172" y="218" width="126" height="56" rx="10" fill="#f5f5f4"/>
    <rect x="316" y="218" width="126" height="56" rx="10" fill="#f5f5f4"/>
  </g>

  <!-- Renewal card -->
  <g filter="url(#shadow)" transform="translate(380 420) rotate(5)">
    <rect width="330" height="170" rx="18" fill="#ffffff"/>
    <rect x="24" y="24" width="52" height="52" rx="12" fill="#eef7f4"/>
    <path d="M38 40h24v22H38zM38 46h24M44 36v8M56 36v8" fill="none" stroke="#15735c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="92" y="30" width="150" height="14" rx="6" fill="#18231f"/>
    <rect x="92" y="54" width="104" height="10" rx="5" fill="#d6d3d1"/>
    <rect x="24" y="104" width="128" height="34" rx="17" fill="#fee2e2"/>
    <circle cx="44" cy="121" r="6" fill="#dc2626"/>
    <rect x="58" y="116" width="78" height="10" rx="5" fill="#dc2626"/>
    <rect x="216" y="108" width="90" height="26" rx="8" fill="#15735c"/>
  </g>

  <!-- Chart card -->
  <g filter="url(#shadow)" transform="translate(90 560) rotate(-3)">
    <rect width="320" height="250" rx="18" fill="#ffffff"/>
    <rect x="26" y="26" width="120" height="12" rx="6" fill="#a8a29e"/>
    <rect x="26" y="50" width="170" height="24" rx="8" fill="#18231f"/>
    <g fill="url(#bar)">
      <rect x="30" y="170" width="30" height="50" rx="6"/>
      <rect x="76" y="140" width="30" height="80" rx="6"/>
      <rect x="122" y="156" width="30" height="64" rx="6"/>
      <rect x="168" y="118" width="30" height="102" rx="6"/>
      <rect x="214" y="132" width="30" height="88" rx="6"/>
      <rect x="260" y="98" width="30" height="122" rx="6"/>
    </g>
  </g>

  <!-- Invoice card -->
  <g filter="url(#shadow)" transform="translate(450 650) rotate(4)">
    <rect width="250" height="230" rx="18" fill="#ffffff"/>
    <rect x="24" y="26" width="90" height="14" rx="6" fill="#15735c"/>
    <rect x="170" y="24" width="56" height="20" rx="10" fill="#d1fae5"/>
    <rect x="24" y="66" width="202" height="2" fill="#e7e5e4"/>
    <rect x="24" y="86" width="120" height="10" rx="5" fill="#d6d3d1"/><rect x="180" y="86" width="46" height="10" rx="5" fill="#a8a29e"/>
    <rect x="24" y="110" width="96" height="10" rx="5" fill="#d6d3d1"/><rect x="180" y="110" width="46" height="10" rx="5" fill="#a8a29e"/>
    <rect x="24" y="134" width="134" height="10" rx="5" fill="#d6d3d1"/><rect x="180" y="134" width="46" height="10" rx="5" fill="#a8a29e"/>
    <rect x="24" y="162" width="202" height="2" fill="#e7e5e4"/>
    <rect x="24" y="182" width="60" height="14" rx="6" fill="#18231f"/><rect x="150" y="180" width="76" height="18" rx="6" fill="#18231f"/>
  </g>
</svg>
